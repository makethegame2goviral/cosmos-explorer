<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cosmos Explorer 3D | Entdecke das Universum</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <canvas id="scene"></canvas>

    <header class="ui-top">
      <div class="brand">
        <span class="logo"></span>
        Cosmos <strong>Explorer</strong>
      </div>
      <nav>
        <a href="#" data-focus="sun">Sonne</a>
        <a href="#" data-focus="earth">Erde</a>
        <a href="#" data-focus="mars">Mars</a>
        <a href="#" data-focus="jupiter">Jupiter</a>
        <a href="#" data-focus="saturn">Saturn</a>
      </nav>
    </header>

    <div class="hint">Ziehen zum Drehen · Scrollen zum Zoomen · Planet anklicken</div>

    <aside id="planetPanel" class="planet-panel hidden">
      <button id="closePanel" aria-label="Schließen">✕</button>
      <div class="planet-head">
        <div id="planetPreview"></div>
        <div>
          <p class="planet-type" id="planetType"></p>
          <h2 id="planetName"></h2>
        </div>
      </div>
      <p id="planetDescription"></p>
      <div class="stats" id="planetStats"></div>
      <h3>Missions-Log</h3>
      <ul id="planetFacts"></ul>
    </aside>

    <div id="loader" class="loader">
      <div class="loader-ring"></div>
      <p>Initialisiere Sonnensystem…</p>
    </div>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>
  <script type="module" src="app.js"></script>
</body>
</html>
